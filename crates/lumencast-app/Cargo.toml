[package]
name = "lumencast-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LumenCast application layer: camera commands and capture events, independent of Tauri."

[lints]
workspace = true

[dependencies]
lumencast-core.workspace = true
serde.workspace = true
thiserror.workspace = true
base64 = "0.22"
lumencast-fx = { path = "../lumencast-fx" }
serde_json = { workspace = true, features = ["preserve_order"] }
lumencast-vision = { path = "../lumencast-vision" }
lumencast-h264 = { path = "../lumencast-h264" }
lumencast-segment = { path = "../lumencast-segment" }
lumencast-nvidia = { path = "../lumencast-nvidia" }
lumencast-audio = { path = "../lumencast-audio" }
lumencast-v4l = { path = "../lumencast-v4l" }
png = "0.17"

[dev-dependencies]
lumencast-h264 = { path = "../lumencast-h264", features = ["test-support"] }
serde_json.workspace = true
tempfile = "3.27.0"
